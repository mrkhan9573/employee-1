steps:

# Install dependencies
- name: python:3.12
  entrypoint: bash
  args:
    - "-c"
    - |
      pip install -r requirements.txt
      pytest

# Build Docker Image
- name: gcr.io/cloud-builders/docker
  args:
    - build
    - "-t"
    - asia-south1-docker.pkg.dev/project-a8be22b6-39b8-45b6-887/cloudrun-repo/employee-api:$SHORT_SHA
    - .

# Push Docker Image
- name: gcr.io/cloud-builders/docker
  args:
    - push
    - asia-south1-docker.pkg.dev/project-a8be22b6-39b8-45b6-887/cloudrun-repo/employee-api:$SHORT_SHA

# Deploy to Cloud Run
- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
    - run
    - deploy
    - employee-api
    - --image=asia-south1-docker.pkg.dev/project-a8be22b6-39b8-45b6-887/cloudrun-repo/employee-api:$SHORT_SHA
    - --platform=managed
    - --region=asia-south1
    - --allow-unauthenticated

images:
- asia-south1-docker.pkg.dev/project-a8be22b6-39b8-45b6-887/cloudrun-repo/employee-api:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
